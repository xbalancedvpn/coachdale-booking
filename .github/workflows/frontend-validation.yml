name: Coach Dale Frontend Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for f in dale-booking.js dale-admin.js dale-ops.js dale-kyle-admin.js dale-public-ui.js dale-media-admin.js dale-date-picker.js dale-admin-calendar.js dale-weekly-schedule.js; do
            node --check "$f"
          done
      - name: Verify required site assets and IDs
        run: |
          node <<'JS'
          const fs=require("fs");
          const pages=[
            ["index.html",["daleForm","daleDate","daleHours","daleSubmit","testimonialForm","nav","menuBtn"]],
            ["admin.html",["daleDashboard","daleLogin","loginForm","opsDialog","blockForm","opsManual","mediaManagement","todayBookings","inquiries","bookings"]]
          ];
          for(const [name,required] of pages){
            const html=fs.readFileSync(name,"utf8");
            const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(x=>x[1]);
            for(const id of required)if(!ids.includes(id))throw Error(name+": missing "+id);
            const duplicate=ids.find((id,i)=>ids.indexOf(id)!==i);
            if(duplicate)throw Error(name+": duplicate id "+duplicate);
            for(const m of html.matchAll(/(?:src|href)="([^"]+\.(?:js|css|png|jpe?g))(\?[^"]*)?"/g)){
              const path=m[1];
              if(/^https?:/.test(path))continue;
              if(!fs.existsSync(path))throw Error(name+": missing asset "+path);
            }
          }
          const portrait="assets/branding/coach-dale-profile.jpg";
          const dashboard="assets/branding/coach-dale-dashboard-bg.jpg";
          const publicPage=fs.readFileSync("index.html","utf8");
          const adminPage=fs.readFileSync("admin.html","utf8");
          const photoStyles=fs.readFileSync("dale-brand-photos.css","utf8");
          for(const asset of [portrait,dashboard]){
            if(!fs.existsSync(asset)||fs.statSync(asset).size<1000)throw Error("Missing original JPG photo: "+asset);
          }
          if(!publicPage.includes('src="'+portrait+'"'))throw Error("Coach profile must reference the portrait JPG.");
          if(!adminPage.includes("dale-brand-photos.css"))throw Error("Admin photo styling is not loaded.");
          if(!publicPage.includes("dale-brand-photos.css"))throw Error("Public photo styling is not loaded.");
          if(!photoStyles.includes(dashboard))throw Error("Dashboard washup must reference action JPG.");
          if(!photoStyles.includes("#coach .coach-photo img"))throw Error("Profile photograph must be full quality.");
          if(!publicPage.includes('class="hero-bg-photo" src="'+dashboard+'"'))throw Error("Public hero action-photo background missing.");
          if(!publicPage.includes('class="nav-favicon" src="assets/branding/coach-dale-favicon.png"'))throw Error("Header must use the two-letter favicon PNG.");
          if(publicPage.includes('class="hero-visual"><img class="hero-photo" src="assets/pickleball-generic.svg"'))throw Error("Old generic illustration should not cover the public hero.");
          if(!photoStyles.includes("#home.hero > .hero-bg-photo"))throw Error("Public hero photo washout styling missing.");
          console.log("Coach Dale JPG photo placements verified.");
          console.log("Frontend asset & element checks passed.");
          JS
      - name: Install calendar testing library
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Test Alpine Elite calendar interactions
        run: node tests/dale-calendar-smoke.cjs
          node tests/dale-admin-calendar-smoke.cjs
          node tests/dale-weekly-schedule-smoke.cjs
